// Amos gRPC contract between the Tauri System UI and the OS-level AI CLI daemon.
//
// Transport: Unix Domain Socket (no TCP loopback) for low latency + process isolation.
syntax = "proto3";

package ai_agent;

// The AI Agent service exposed by the OS daemon (amos-ai).
//
// The Tauri Rust core acts as a *client*: it opens a stream, consumes the
// token stream, and re-emits each token to the WebView as a Tauri event so
// the UI stays perfectly in sync (typing-machine effect) without blocking.
service AiAgent {
  // Unary request -> server-streaming tokens (chat / long text generation).
  rpc StreamChat(AgentRequest) returns (stream AgentChunk);

  // Bidirectional streaming: client pushes prompts/audio, server streams tokens.
  // Ideal for voice interaction and multi-turn agent orchestration.
  rpc Chat(stream ClientMessage) returns (stream AgentChunk);

  // Lightweight liveness / capability probe used by the System UI.
  rpc GetStatus(StatusRequest) returns (StatusReply);

  // List the daemon's tracked agent sessions (id, model, usage) — lets the UI
  // show / manage live conversations.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsReply);

  // Remove all tracked sessions (session-management UI's "clear all").
  rpc ClearSessions(ClearSessionsRequest) returns (ClearSessionsReply);

  // Remove a single tracked session by id.
  rpc RemoveSession(RemoveSessionRequest) returns (RemoveSessionReply);

  // Fetch one session's completed conversation history.
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryReply);
}

message AgentRequest {
  string session_id = 1;                 // arbitrary id used to correlate the stream
  string prompt = 2;                     // user/system text input
  map<string, string> context = 3;       // injected OS context (screen a11y text, intent, etc.)
}

message AgentChunk {
  string session_id = 1;                 // echoes back the originating session_id
  string token = 2;                      // next piece of generated text
  bool done = 3;                         // true on the terminal frame of the stream
  string error = 4;                      // non-empty when the generation failed
  UiCard card = 5;                       // optional structured UI descriptor (semantic "card")
}

// A structured, AI-generated UI descriptor. The frontend renders these as
// dynamic cards ("语义中枢 → 像素表面"), so the agent can drive the interface
// instead of only returning text. See `cards.js` for the renderers.
message UiCard {
  string kind = 1;                // "weather" | "media" | "note" | "wallet" | "action" | ...
  string title = 2;
  string subtitle = 3;
  repeated UiField fields = 4;    // key/value rows to display
  repeated string actions = 5;    // quick-action button labels
}

message UiField {
  string key = 1;
  string value = 2;
}

message ClientMessage {
  oneof payload {
    string prompt = 1;                   // push a text prompt into the stream
    bytes audio = 2;                     // push an audio frame (voice interaction)
    string cancel = 3;                   // request cancellation of the current turn
    bool audio_end = 4;                  // "end of utterance": force-finalize the
                                         // current speech segment now (push-to-talk
                                         // release), instead of waiting for the
                                         // recognizer's own VAD/endpoint.
  }
}

message StatusRequest {}

message StatusReply {
  bool running = 1;                      // is the inference daemon alive & ready
  string model = 2;                      // active model identifier
  int64 uptime_seconds = 3;              // daemon uptime
  uint32 gpu_util = 4;                   // rough GPU/NPU utilisation percent
  uint32 active_sessions = 5;            // number of live agent sessions
  int64 rpc_total = 6;                   // RPCs seen at the gRPC boundary (monitoring)
  int64 heartbeats = 7;                  // periodic self-health ticks emitted (monitoring)

  // Operational truth (added 2026-09): what inference/ASR engine is actually
  // serving right now, so a UI/operator never mistakes a degraded (mock) engine
  // for real inference.
  string engine = 8;                     // active inference engine kind: mock|api|ollama|hermes|ggml
  string engine_model = 9;               // concrete model behind `engine` (empty for mock)
  bool degraded = 10;                    // a real engine was requested but the daemon is serving mock
  string asr = 11;                       // voice ASR backend in effect: mock|sherpa|off

  // Inference performance / power profile (amos-profiling), added 2026-09-04.
  // Present on every reply; consumers treat decode_runs == 0 as "no runs yet".
  ProfileMetrics profile = 12;

  // Energy-governor decision (amos-power), added 2026-09-04. Present on every
  // reply once the periodic governor has ticked at least once; consumers treat
  // ticks == 0 as "governor has not run yet".
  EnergyPolicy energy = 13;

  // Resource-governor (amos_ai::governor::ResourceGovernor) live decision, added
  // 2026-09-04: what the daemon's energy→lifecycle→scheduler closed loop is doing
  // (sensor mode + throttle/cap recommendations + tick count). mirrors the
  // Governor service's GovernorDecision. ticks == 0 ⇒ not run yet.
  GovernorMetrics governor = 14;

  // Resolved device-acceleration target of the local inference path, added
  // 2026-09-04 (amos_ai::accelerator): "<vendor>/<accel>", e.g. "android/nnapi" or
  // "qualcomm/qnn" — reported ONLY when a local engine that uses it is serving
  // (ggml). Empty otherwise, and never "auto" (always the concrete resolution).
  // See docs/qcom-mtk-bringup.md. Consumers treat empty as "not applicable".
  string accelerator = 15;

  // System working-status (amos-monitor), added 2026-09-05: unified OS load
  // (CPU/memory) + per-process lifecycle counts + (honestly) unknown battery when
  // not available. Present on every reply; absent Optionals mean "unknown", never
  // a fabricated reading. Backing sampler named in `sampler`.
  SystemHealth system = 16;

  // Daemon-wide generation admission gate (REQ-A43), added 2026-09-11: live
  // concurrency bounded by AMOS_MAX_SESSIONS. `in_flight` never exceeds
  // `capacity` (the pool enforces it structurally). Present on every reply from
  // this daemon version; a pre-this-field daemon leaves it absent (= unknown).
  GenerationPoolMetrics generation_pool = 17;

  // Inference-response cache (REQ-A44), added 2026-09-11: opt-in via
  // AMOS_RESPONSE_CACHE=1. When disabled (`enabled=false`) every counter is the
  // honest zero of a cache that stored/looked up nothing — never fabricated.
  ResponseCacheMetrics response_cache = 18;

  // On-disk log sink health (REQ-A87), added 2026-09-11: the daemon persists its
  // tracing output to a bounded, self-rotating file when AMOS_LOG_DIR is set
  // (default ~/.amos/logs). `enabled=false` means stdout only — the counters are
  // then the honest zeros of a sink that never persisted anything. A non-zero
  // `lost_bytes`/`write_failures` is how an operator learns the on-disk trail is
  // *incomplete* instead of assuming it is complete.
  LogSinkMetrics log_sink = 19;

  // Backend circuit breaker (REQ-A131), added 2026-09-12: while a backend is down,
  // generations fail fast with a stated reason instead of every caller walking the
  // full backend timeout. `enabled=false` (AMOS_BREAKER=0) means the decorator is not
  // in the serving path at all — the counters are then the honest zeros of a breaker
  // that never made a decision. `state` is "closed" | "open" | "half_open"; a
  // non-zero `rejections` is how an operator learns calls were *skipped on purpose*
  // rather than lost. See docs/daemon-resource-gate.md.
  BreakerMetrics breaker = 20;

  // Threshold alerts derived from the counters above (REQ-A133), added 2026-09-12:
  // one place that says what is *wrong right now* instead of making an operator read
  // eight blocks. `alerts` is EMPTY for a healthy daemon — absence means "no rule
  // fired", never "checked and all good by some other authority". Nothing is
  // delivered anywhere: this is a report, not a notification channel.
  Alerts alerts = 21;
}

// The active alerts at the moment of this reply (amos_ai::alerts). Recomputed on
// every call, so a recovered condition disappears rather than sticking as a stale
// alarm. `active_for_seconds` counts from when *this daemon process* first observed
// the condition — a restart resets it, so it must not be read as "how long the
// problem has existed".
message Alerts {
  repeated Alert alerts = 1;  // ordered: errors first, then by id (stable)
}

message Alert {
  string id = 1;                    // breaker_open | engine_degraded | log_trail_incomplete |
                                    // generations_rejected | power_throttled | dvfs_write_failures
  string severity = 2;              // warn | error
  string detail = 3;                // the numbers behind it, e.g. "12 generation(s) were rejected…"
  uint64 active_for_seconds = 4;    // since this process first saw it (0 on first sight)
}

// Live state + counters of the backend circuit breaker (amos_ai::breaker). Every
// number is a decision that actually happened: `openings` counts transitions *into*
// Open, `rejections` counts calls skipped without touching the backend, and
// `successes`/`failures` count observed generation outcomes (a completed stream is a
// success; a start error or a mid-stream error is a failure).
message BreakerMetrics {
  bool enabled = 1;             // AMOS_BREAKER != 0 (false => not in the path)
  string state = 2;             // closed | open | half_open
  uint32 fail_threshold = 3;    // consecutive failures that open it (AMOS_BREAKER_FAILS)
  uint64 cooldown_seconds = 4;  // open duration before a probe (AMOS_BREAKER_COOLDOWN_SECS)
  uint32 consecutive_failures = 5;  // current run while closed
  uint64 openings = 6;          // transitions into Open
  uint64 rejections = 7;        // calls skipped (backend untouched)
  uint64 failures = 8;          // observed generation failures
  uint64 successes = 9;         // observed completed generations
}

// Live state + counters of the daemon's bounded on-disk log sink
// (amos_ai::logfile). `bytes_written` counts what was appended; `lost_bytes`
// counts what a failed write/rotation could not persist, so the two together say
// how much of the trail exists and how much went missing.
message LogSinkMetrics {
  bool enabled = 1;             // a file sink is open (false => stdout only)
  string path = 2;              // the active file ("" when disabled)
  uint64 bytes_written = 3;     // bytes appended since start-up
  uint64 lost_bytes = 4;        // bytes a failed write could not persist
  uint64 write_failures = 5;    // failed write/flush/rotation attempts
  uint64 rotations = 6;         // completed roll-overs (older lines moved to .1…)
  uint64 active_bytes = 7;      // size of the active file right now
}

// Live state + monotonic counters of the daemon's generation admission pool
// (amos_ai::pool::GenerationPool). `in_flight <= capacity` is an invariant, not
// a hope: the semaphore cannot hand out more permits than it holds.
message GenerationPoolMetrics {
  uint32 capacity = 1;            // fixed slots (AMOS_MAX_SESSIONS; never 0)
  uint32 in_flight = 2;           // slots held right now (<= capacity)
  uint32 available = 3;           // free slots right now (capacity - in_flight)
  uint64 acquired_total = 4;      // generations admitted since daemon start
  uint64 rejected_saturated = 5;  // fail-fast rejections (all slots busy)
  uint64 rejected_timeout = 6;    // bounded-wait timeouts (AMOS_GEN_POOL_WAIT_MS)
  uint64 wait_ms = 7;             // configured bounded wait (0 = fail-fast)
}

// Live state + honest counters of the inference-response cache
// (amos_ai::cache::ResponseCache). `entries <= capacity`; hits + misses equals
// the number of lookups performed. Disabled => enabled=false, all counters 0.
message ResponseCacheMetrics {
  bool enabled = 1;               // AMOS_RESPONSE_CACHE=1
  uint32 capacity = 2;            // max entries held (LRU bound)
  uint64 ttl_seconds = 3;         // entry time-to-live
  uint32 entries = 4;             // entries held right now
  uint64 hits = 5;                // lookups served from cache
  uint64 misses = 6;              // lookups not in cache (incl. expired)
  uint64 stores = 7;              // completed generations written
  uint64 evicted = 8;             // entries dropped by the LRU bound
  uint64 expired = 9;             // entries dropped by TTL
  uint64 oversized = 10;          // store attempts rejected as too large
}

// Unified "system working status" folded from amos-monitor (docs/system-monitor.md).
message SystemHealth {
  SystemLoad load = 1;              // CPU / memory load from the active sampler
  SystemBattery battery = 2;        // level/power; fields absent = unknown
  ProcessCounts processes = 3;      // per-process lifecycle tiers
  string sampler = 4;               // sampler backend: linux-proc | mock | android | ...
  repeated AppProcess apps = 5;     // per-app processes the governor tracks (empty on
                                    // hosts where nothing is registered yet)
}

message AppProcess {
  string id = 1;                    // app/process id ("com.amos.photos", …)
  string state = 2;                 // lifecycle key: foreground|visible|foreground_service|
                                    // background|cached|stopped
}

message SystemLoad {
  // Mean busy% over the sampler's last window (0..100). Absent on the first read
  // after start (busy% is a delta) or when the platform cannot report it.
  optional double cpu_busy_pct = 1;
  optional uint64 mem_total_bytes = 2;      // absent = unknown
  optional uint64 mem_available_bytes = 3;  // absent = unknown (used% derived)
}

message SystemBattery {
  // Absent = unknown (never a fabricated reading).
  optional double level_pct = 1;
  optional bool charging = 2;
  optional double live_power_mw = 3;
}

message ProcessCounts {
  uint32 running = 1;   // live processes (any state except Stopped)
  uint32 cached = 2;    // frozen tombstone tier
  uint32 stopped = 3;   // dead but kept saved state
}

// Rolling decode-throughput + first-token latency measured by the daemon across
// its stream_chat text turns (see amos-ai/src/profiler.rs). Honest labels:
// decode_tokens_per_sec is end-to-end "generated tokens streamed to the client
// per second" (includes backend/network latency); ttft_ms is the mean wall time
// from a turn starting until its first token arrives.
message ProfileMetrics {
  double decode_tokens_per_sec = 1;      // 0 when decode_runs == 0
  double ttft_ms = 2;                    // mean first-token latency; 0 when no runs
  uint64 decode_tokens_total = 3;        // tokens streamed since daemon start
  uint64 decode_runs = 4;                // completed stream_chat decode turns (>0 ⇒ data)
}

// Rolling energy-governor decision from amos-ai/src/energy.rs (amos-power). The
// governor folds battery level / charger state / temperature / live power /
// foreground-background usage (env-configured on a host, real HAL on-device) into
// a recommended sensor mode + throttle flags each tick.
message EnergyPolicy {
  string sensor_mode = 1;                // performance | balanced | power_save
  string reason = 2;                     // charging|healthy|power_draw|battery_low|… (see amos_power::Reason::key)
  bool cap_inference = 3;                // governor recommends capping / deferring inference
  bool throttle_background = 4;          // governor recommends deferring background work
  uint64 ticks = 5;                      // periodic governor ticks so far (>0 ⇒ data)
}

// The daemon's ResourceGovernor live decision (energy → lifecycle → scheduler).
message GovernorMetrics {
  string sensor_mode = 1;                // performance | balanced | power_save
  string reason = 2;                     // charging|healthy|battery_low|… (see amos_power::Reason::key)
  bool cap_inference = 3;
  bool throttle_background = 4;
  uint64 ticks = 5;                      // governor observe ticks so far (>0 ⇒ it has run)
  uint64 dvfs_applied = 6;               // total scaling_max_freq writes applied by the DVFS beat
  uint64 dvfs_failed = 7;                // total DVFS write failures the seam reported
  uint64 dropped = 8;                    // deferred jobs whose window expired (never ran) this tick
}

message ListSessionsRequest {}

message SessionInfo {
  string session_id = 1;
  string model = 2;
  uint64 tokens_generated = 3;           // tokens produced in this session
  bool cancelled = 4;
  uint64 age_seconds = 5;                // seconds since the session was created
}

message ListSessionsReply {
  repeated SessionInfo sessions = 1;     // most-recently-active first
  uint32 count = 2;                      // number of sessions returned
}

message ClearSessionsRequest {}

message ClearSessionsReply {
  uint32 removed = 1;                    // how many sessions were cleared
}

message RemoveSessionRequest {
  string session_id = 1;
}

message RemoveSessionReply {
  bool removed = 1;                      // true when the session existed and was removed
}

message GetHistoryRequest {
  string session_id = 1;
}

message HistoryTurn {
  string role = 1;                       // "user" | "assistant"
  string text = 2;
}

message GetHistoryReply {
  string session_id = 1;
  string model = 2;
  uint64 tokens_generated = 3;
  bool cancelled = 4;
  repeated HistoryTurn turns = 5;        // completed turns, oldest first
}

// RAG retrieval service: offline local vector search over the daemon's indexed
// notes / documents ("ask my files"). A separate service from `AiAgent` so it
// stays a clean, independently-testable seam; "retrieve-then-answer" is composed
// by a caller as `Rag.Query` (returns the nearest ids + their passage text) then
// `AiAgent.StreamChat` with that context dropped into the prompt. Honest scope:
// retrieval relevance is what the local embedding model (Ollama `/api/embeddings`
// on device) gives you — see docs/vector-db-rag.md.
service Rag {
  // Index (or re-index on edit) a passage under an id.
  rpc Index(RagIndexRequest) returns (RagIndexReply);

  // Drop a passage from future retrieval.
  rpc Remove(RagRemoveRequest) returns (RagRemoveReply);

  // Retrieve the nearest indexed ids to a query (embed + exact top-k).
  rpc Query(RagQueryRequest) returns (RagQueryReply);

  // Lightweight probe: how many passages are indexed + the vector dimension.
  rpc Status(RagStatusRequest) returns (RagStatusReply);
}

message RagIndexRequest {
  string id = 1;                 // stable identity (note id / chunk ref) to (re)index under
  string text = 2;               // passage body to embed + index
}

message RagIndexReply {
  bool indexed = 1;
  uint32 dimension = 2;          // vector dimension after this ingest
}

message RagRemoveRequest {
  string id = 1;
}

message RagRemoveReply {
  bool removed = 1;              // true when the id was present and dropped
}

message RagQueryRequest {
  string query = 1;              // natural-language query to embed
  uint32 top_k = 2;              // max hits to return; 0 => daemon default (5)
}

message RagHit {
  string id = 1;
  double score = 2;              // cosine similarity (higher = closer); 0 for an empty index
  string passage = 3;            // the indexed text for that id (for citations)
}

message RagQueryReply {
  repeated RagHit hits = 1;      // highest-scoring first
  uint32 count = 2;
}

message RagStatusRequest {}

message RagStatusReply {
  uint64 indexed = 1;            // passages currently indexed
  uint32 dimension = 2;          // 0 when nothing indexed yet (dimension unknown)
  string embedder = 3;           // "mock" | "ollama" (honest backend label)
}
