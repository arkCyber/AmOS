[workspace]
resolver = "2"
members = [
    "crates/amos-proto",
    "crates/amos-audio",
    "crates/amos-ai",
    "crates/amos-wm",
    "crates/amos-android",
    "crates/amos-tauri",
    "crates/amos-supervisor",
    "crates/amos-translate",
    "crates/amos-mail",
    "crates/amos-mail-cli",
    "crates/amos-int",
    "crates/amos-int-cli",
    "crates/amos-asr",
    "crates/amos-telephony",
    "crates/amos-tts",
    "crates/amos-appstore",
    "crates/amos-appstore-cli",
    "crates/amos-timesync",
    "crates/amos-timesync-cli",
    "crates/amos-radio",
    "crates/amos-jni",
    "crates/amos-flashlight",
    "crates/amos-sensor",
    "crates/amos-profiling",
    "crates/amos-power",
    "crates/amos-applife",
    "crates/amos-scheduler",
    "crates/amos-monitor",
    "crates/amos-network-guard",
    "crates/amos-telemetry-spy",
    "crates/amos-media",
    "crates/amos-clipboard",
    "crates/amos-display",
    "crates/amos-web3",
    "crates/amos-identity",
    "crates/amos-pdf-parser",
    "crates/amos-vector-db",
    "crates/amos-sms",
    "crates/amos-blocklist",
    "crates/amos-devocare",
    "crates/amos-ime",
    "crates/amos-link",
    "crates/amos-link-cli",
    "crates/amos-link-cc",
    "crates/amos-mdm",
    "crates/amos-robot",
    "crates/amos-config",
    "crates/amos-notifier",
    "crates/amos-ota",
    "crates/amos-ota-cli",
    "crates/amos-podcast",
    "crates/amos-podcast-cli",
    # "crates/amos-link-py",  # PyO3 extension - build with maturin, not cargo
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Amos Team"]
description = "amos: an AI-first mobile OS built on Tauri + a native Rust AI CLI daemon."

# Shared dependency versions so every crate stays in lockstep.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = "2"
tauri-build = "2"
pnet = "0.35"
sha2 = "0.10"
hex = "0.4"

# ---- local workspace crates ----
amos-proto = { path = "crates/amos-proto" }
amos-android = { path = "crates/amos-android" }
amos-jni = { path = "crates/amos-jni" }
amos-int = { path = "crates/amos-int" }
amos-appstore = { path = "crates/amos-appstore" }
amos-timesync = { path = "crates/amos-timesync" }
amos-telephony = { path = "crates/amos-telephony" }
amos-flashlight = { path = "crates/amos-flashlight" }
amos-sensor = { path = "crates/amos-sensor" }
amos-profiling = { path = "crates/amos-profiling" }
amos-power = { path = "crates/amos-power" }
amos-applife = { path = "crates/amos-applife" }
amos-scheduler = { path = "crates/amos-scheduler" }
amos-monitor = { path = "crates/amos-monitor" }
amos-network-guard = { path = "crates/amos-network-guard" }
amos-telemetry-spy = { path = "crates/amos-telemetry-spy" }
amos-display = { path = "crates/amos-display" }
amos-media = { path = "crates/amos-media" }
amos-clipboard = { path = "crates/amos-clipboard" }
amos-web3 = { path = "crates/amos-web3" }
amos-identity = { path = "crates/amos-identity" }
amos-ime = { path = "crates/amos-ime" }
# AmOS-Link: the robot middleware (pub/sub + framing + LAN discovery + robot HAL).
amos-link = { path = "crates/amos-link" }
# The autonomy stack above the link: attitude fusion, path planning, a cadence-measured
# control loop (docs/robot-autonomy.md).
amos-robot = { path = "crates/amos-robot" }
# C ABI for amos-link (loadable from C, C++, or any POSIX toolchain).
amos-link-cc = { path = "crates/amos-link-cc" }
amos-mdm = { path = "crates/amos-mdm" }
# Layered configuration (system → user → session → remote) + JSON-schema
# validation + hot-reload + runtime feature flags. Zero new dependency (the
# schema validator lives in-tree, see crates/amos-config/src/schema.rs).
# docs/devops.md §4.
amos-config = { path = "crates/amos-config" }
# Notification dispatcher for the alert pipeline: P0/P1/P2 levels + suppression
# window + per-channel rate limiting + webhook (Slack-style) + SMTP. Pure std
# core; SMTP body is built with `letter-encoding` would be nicer but the
# project policy is "no new external deps without a written reason", so the
# SMTP client is the project-internal `smtp-transport` module that mirrors
# what `amos-mail` already does for the foreground path.
# docs/devops.md §3.
amos-notifier = { path = "crates/amos-notifier" }
# System-update (OTA) decision layer: SemVer precedence + channels + rollout
# cohorts + integrity/signature policy + a staged install state machine. Pure
# domain core; the network/deploy halves stay caller seams.
amos-ota = { path = "crates/amos-ota" }
# Podcasts domain core: RSS/Atom parsing + a FeedProvider seam + a bounded
# subscription/progress store. Pure domain; the network half stays behind the
# `live` feature and the UI/CLI are separate crates.
amos-podcast = { path = "crates/amos-podcast" }
# Wire codecs shared by the link layer (see crates/amos-link/src/codec.rs).
bincode = "1.3"
crc32fast = "1"
serde_json = "1"
async-trait = "0.1"

# ---- profile tuning for fast iteration / smaller mobile binaries ----
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
strip = true
