[workspace]
resolver = "2"
members = [
    "crates/amos-proto",
    "crates/amos-audio",
    "crates/amos-ai",
    "crates/amos-wm",
    "crates/amos-android",
    "crates/amos-tauri",
    "crates/amos-supervisor",
    "crates/amos-translate",
    "crates/amos-mail",
    "crates/amos-mail-cli",
    "crates/amos-int",
    "crates/amos-int-cli",
    "crates/amos-asr",
    "crates/amos-telephony",
    "crates/amos-tts",
    "crates/amos-appstore",
    "crates/amos-appstore-cli",
    "crates/amos-timesync",
    "crates/amos-timesync-cli",
    "crates/amos-radio",
    "crates/amos-flashlight",
    "crates/amos-sensor",
    "crates/amos-profiling",
    "crates/amos-power",
    "crates/amos-applife",
    "crates/amos-scheduler",
    "crates/amos-monitor",
    "crates/amos-network-guard",
    "crates/amos-telemetry-spy",
    "crates/amos-media",
    "crates/amos-clipboard",
    "crates/amos-display",
    "crates/amos-web3",
    "crates/amos-identity",
    "crates/amos-pdf-parser",
    "crates/amos-vector-db",
    "crates/amos-sms",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Amos Team"]
description = "amos: an AI-first mobile OS built on Tauri + a native Rust AI CLI daemon."

# Shared dependency versions so every crate stays in lockstep.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = "2"
tauri-build = "2"
pnet = "0.35"

# ---- local workspace crates ----
amos-proto = { path = "crates/amos-proto" }
amos-android = { path = "crates/amos-android" }
amos-int = { path = "crates/amos-int" }
amos-appstore = { path = "crates/amos-appstore" }
amos-timesync = { path = "crates/amos-timesync" }
amos-telephony = { path = "crates/amos-telephony" }
amos-flashlight = { path = "crates/amos-flashlight" }
amos-sensor = { path = "crates/amos-sensor" }
amos-profiling = { path = "crates/amos-profiling" }
amos-power = { path = "crates/amos-power" }
amos-applife = { path = "crates/amos-applife" }
amos-scheduler = { path = "crates/amos-scheduler" }
amos-monitor = { path = "crates/amos-monitor" }
amos-network-guard = { path = "crates/amos-network-guard" }
amos-telemetry-spy = { path = "crates/amos-telemetry-spy" }
amos-display = { path = "crates/amos-display" }
amos-media = { path = "crates/amos-media" }
amos-clipboard = { path = "crates/amos-clipboard" }
amos-web3 = { path = "crates/amos-web3" }
amos-identity = { path = "crates/amos-identity" }

# ---- profile tuning for fast iteration / smaller mobile binaries ----
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
strip = true
