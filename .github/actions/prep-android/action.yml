name: 'AmOS prep Android NDK toolchain (host)'
description: >-
  Idempotent host provisioning of the PINNED Android NDK + cargo-ndk + rustup
  android targets + protoc used by the native-gated CI jobs. Keep the input
  defaults in lockstep with .github/docker/ci-android/Dockerfile (single source:
  the container image). Host mode exists so CI stays green out of the box even
  before the container image is published; container mode (repo Variable
  CI_ANDROID_IMAGE) replaces this with the pre-baked image.
inputs:
  ndk-version:
    description: 'Android NDK version to install (matches Dockerfile ARG NDK_VERSION).'
    default: '26.1.10909125'
  cargo-ndk-version:
    description: 'cargo-ndk version to install (matches Dockerfile ARG CARGO_NDK_VERSION).'
    default: '4.1.2'
outputs:
  ndk-home:
    description: 'Absolute path of the installed (pinned) Android NDK.'
    value: ${{ steps.ndk-home.outputs.path }}
runs:
  using: composite
  steps:
    - name: Install Rust (stable + rustfmt + clippy)
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install pinned protoc (for tonic-prost-build)
      uses: arduino/setup-protoc@v3

    - name: Add rustup Android targets
      shell: bash
      run: |
        rustup target add \
          aarch64-linux-android \
          armv7-linux-androideabi \
          x86_64-linux-android \
          i686-linux-android

    - name: Install pinned cargo-ndk
      shell: bash
      run: |
        if ! command -v cargo-ndk >/dev/null 2>&1; then
          cargo install cargo-ndk --version "${{ inputs.cargo-ndk-version }}" --locked
        fi
        echo "cargo-ndk: $(cargo ndk --version 2>/dev/null || echo '<bin present>')"

    - name: Provision Android SDK (cmdline-tools + sdkmanager)
      uses: android-actions/setup-android@v3

    - name: Install pinned NDK + accept licenses
      shell: bash
      run: |
        # setup-android sets ANDROID_SDK_ROOT for the rest of this job.
        NDK_ROOT="${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT unset}/ndk"
        if [ ! -d "$NDK_ROOT/${{ inputs.ndk-version }}" ]; then
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${{ inputs.ndk-version }}"
        fi
        test -d "$NDK_ROOT/${{ inputs.ndk-version }}" \
          || { echo "error: NDK ${{ inputs.ndk-version }} missing after install" >&2; exit 1; }

    - name: Export NDK home
      id: ndk-home
      shell: bash
      run: |
        NDK_ROOT="${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT unset}/ndk"
        echo "path=$NDK_ROOT/${{ inputs.ndk-version }}" >> "$GITHUB_OUTPUT"
        echo "Android NDK: $NDK_ROOT/${{ inputs.ndk-version }}"
