name: Release

# Publishes the headless release bundle for a `v*` tag (FUNCTIONAL_GAP_ANALYSIS #39).
#
# There is exactly ONE implementation of "what a release contains": the script
# `scripts/release-artifacts.sh`. A maintainer runs the same script locally via
# `make release-artifacts`, so a published asset can always be reproduced — and the
# script refuses to package a binary that cannot report its own version (`--version`).
#
# Matrix is deliberately native-only (no cross-compiling, no GUI/APK toolchains):
#   ubuntu-24.04  -> x86_64-unknown-linux-gnu   (the daemon's own target class)
#   macos-14      -> aarch64-apple-darwin       (desktop dev / the bundle we can
#                                                reproduce on a maintainer's Mac)
# The Tauri desktop bundle and the Android APK are separate build paths
# (`make run-ui-release` / `make android-app`) and are not produced here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# A release must not be cancelled halfway by a superseding push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: bundle (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: x86_64-unknown-linux-gnu
          - runner: macos-14
            label: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (for tonic-prost-build)
        uses: arduino/setup-protoc@v3

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build + package (${{ matrix.label }})
        # On a tag build the script refuses a tag/version mismatch, so a release can
        # never be named after one version while containing another.
        env:
          AMOS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: bash scripts/release-artifacts.sh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: amos-${{ github.ref_name }}-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish release assets
    needs: bundle
    # Only a tag push publishes; a manual run just builds the artifacts above.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: |
          cd dist
          ls -l
          sha256sum -c SHA256SUMS

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS \
              --title "AmOS $tag" --generate-notes
          fi
