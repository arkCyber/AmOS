name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same branch/PR so a flaky intermediate push
# doesn't queue a pile of doomed jobs behind the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Shared Rust toolchain + caches. Each job installs only what it needs (Tauri
# Linux deps only where amos-tauri is compiled; protoc only where amos-proto
# (tonic) is built).
#
# NOTE on runner drift: every job pins `ubuntu-24.04` instead of floating on
# `ubuntu-latest`. GitHub migrated default runners 22.04 -> 24.04, which REMOVED
# the `libappindicator3-dev` package (replaced by `libayatana-appindicator3-dev`)
# and silently broke Tauri deps on jobs still installing the old name. Pinning
# the major and using the ayatana name stops that class of regression.
jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc (for tonic-prost-build)
        uses: arduino/setup-protoc@v3

      - name: Install Tauri (Linux) system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Lint (fmt + clippy -D warnings)
        run: make lint

      - name: Test (Rust workspace + TS System-UI)
        run: make test

      - name: Coverage gate (TS core lib, P2-1)
        run: make cov

  # Headless end-to-end gates: start a mock daemon and drive the real chain
  # (text CLI smoke + audio->ASR->translate->TTS full chain). No Tauri needed.
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (for tonic-prost-build)
        uses: arduino/setup-protoc@v3

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Smoke (int-cli + full_chain)
        run: make smoke

      # Headless supervisor gate: real daemons under the supervisor with no GUI,
      # SIGUSR1 hot-restart, and a graceful SIGINT stop with no orphaned children.
      - name: Smoke (supervisor headless launch/restart/stop)
        run: make sup-smoke


  # Native gated backends — sherpa-onnx ASR (`amos-asr`) and Piper TTS
  # (`amos-tts`). These download prebuilt native libs, so this runs on GitHub's
  # *networked* runners. Verified against sherpa-onnx 1.13.7 / piper-rs 0.2.
  # Required gate: the sherpa/Piper config APIs are calibrated in-tree.
  #
  # Two modes, chosen by the repository Variable CI_ANDROID_IMAGE:
  #   * set   -> run `make gated-check` inside the pinned native container image
  #              (.github/docker/ci-android + .github/workflows/container-image.yml)
  #   * unset -> host fallback below (provisions the same deps on the runner).
  # Default is the unset (host) path so CI stays green without a published image.
  gated-native-backends:
    runs-on: ubuntu-24.04
    env:
      CARGO_NET_RETRY: 3
      CARGO_HTTP_TIMEOUT: 120
    steps:
      - uses: actions/checkout@v7

      - name: Run gated native backends in pinned container
        if: vars.CI_ANDROID_IMAGE != ''
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            "${{ vars.CI_ANDROID_IMAGE }}" \
            bash -lc 'make gated-check'

      - name: Install Rust
        if: vars.CI_ANDROID_IMAGE == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (for tonic-prost-build)
        if: vars.CI_ANDROID_IMAGE == ''
        uses: arduino/setup-protoc@v3

      - name: Install build tools + Tauri (Linux) deps
        if: vars.CI_ANDROID_IMAGE == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Cargo cache
        if: vars.CI_ANDROID_IMAGE == ''
        uses: Swatinem/rust-cache@v2

      - name: Compile sherpa + Piper backends (host)
        if: vars.CI_ANDROID_IMAGE == ''
        run: make gated-check

  # Android NDK gate for amos-audio's hand-written audio seams (AAudio/TinyALSA).
  # Cross-compiles every Android ABI and link-checks AAudio against the NDK's
  # libaaudio.so via the aaudio_link_smoke example. The FFI is only compiled for
  # target_os = "android", so this is the *only* place its signatures are ever
  # validated — without it, a host-green `make test` never touches the seam.
  #
  # Same container/host split as gated-native-backends (see vars.CI_ANDROID_IMAGE).
  # The host fallback provisions a PINNED NDK (26.1.10909125) via the shared
  # prep-android composite action — no floating NDK, no `cargo-ndk` at latest.
  android-audio-seams:
    runs-on: ubuntu-24.04
    env:
      CARGO_NET_RETRY: 3
      CARGO_HTTP_TIMEOUT: 120
    steps:
      - uses: actions/checkout@v7

      - name: Run Android audio seams + sherpa in pinned container
        if: vars.CI_ANDROID_IMAGE != ''
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e ANDROID_NDK_HOME=/opt/android-sdk/ndk/26.1.10909125 \
            "${{ vars.CI_ANDROID_IMAGE }}" \
            bash -lc 'make android-audio-check && make android-ai-sherpa-check'

      - name: Prepare pinned NDK toolchain on host
        if: vars.CI_ANDROID_IMAGE == ''
        id: prep-android
        uses: ./.github/actions/prep-android

      - name: Compile + link AAudio/TinyALSA seams for Android (host)
        if: vars.CI_ANDROID_IMAGE == ''
        env:
          ANDROID_NDK_HOME: ${{ steps.prep-android.outputs.ndk-home }}
        run: make android-audio-check

      - name: Compile + link amos-ai with real sherpa on-device ASR (host)
        if: vars.CI_ANDROID_IMAGE == ''
        env:
          ANDROID_NDK_HOME: ${{ steps.prep-android.outputs.ndk-home }}
        run: make android-ai-sherpa-check
