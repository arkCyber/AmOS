name: CI

on:
  push:
  pull_request:

# Shared Rust toolchain + caches. Each job installs only what it needs (Tauri
# Linux deps only where amos-tauri is compiled; protoc only where amos-proto
# (tonic) is built).
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc (for tonic-prost-build)
        uses: arduino/setup-protoc@v3

      - name: Install Tauri (Linux) system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Lint (fmt + clippy -D warnings)
        run: make lint

      - name: Test (Rust workspace + TS System-UI)
        run: make test

      - name: Coverage gate (TS core lib, P2-1)
        run: make cov

  # Headless end-to-end gates: start a mock daemon and drive the real chain
  # (text CLI smoke + audio->ASR->translate->TTS full chain). No Tauri needed.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (for tonic-prost-build)
        uses: arduino/setup-protoc@v3

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Smoke (int-cli + full_chain)
        run: make smoke

      # Headless supervisor gate: real daemons under the supervisor with no GUI,
      # SIGUSR1 hot-restart, and a graceful SIGINT stop with no orphaned children.
      - name: Smoke (supervisor headless launch/restart/stop)
        run: make sup-smoke

  # Native gated backends — sherpa-onnx ASR (`amos-asr`) and Piper TTS
  # (`amos-tts`). These download prebuilt native libs, so this runs on GitHub's
  # *networked* runners. Verified against sherpa-onnx 1.13.7 / piper-rs 0.2.
  # Required gate: the sherpa/Piper config APIs are calibrated in-tree.
  gated-native-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (for tonic-prost-build)
        uses: arduino/setup-protoc@v3

      - name: Install build tools + Tauri (Linux) deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Compile sherpa + Piper backends
        run: make gated-check

  # Android NDK gate for amos-audio's hand-written audio seams (AAudio/TinyALSA).
  # Cross-compiles every Android ABI and link-checks AAudio against the NDK's
  # libaaudio.so via the aaudio_link_smoke example. The FFI is only compiled for
  # target_os = "android", so this is the *only* place its signatures are ever
  # validated — without it, a host-green `make test` never touches the seam.
  android-audio-seams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install protoc (for amos-proto / amos-ai build)
        uses: arduino/setup-protoc@v3

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (AAudio ships from API 26)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Compile + link AAudio/TinyALSA seams for Android
        run: make android-audio-check

      - name: Compile + link amos-ai with real sherpa on-device ASR (Android)
        run: make android-ai-sherpa-check

