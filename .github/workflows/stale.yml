name: "Stale Issues and Pull Requests"

on:
  schedule:
    - cron: "0 0 * * 0"  # Every Sunday at midnight
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Issues configuration
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: |
            This issue has been inactive for 60 days. It will be closed in 7 days unless there is new activity.
            
            If you're still working on this or have updates, please comment to keep it open.
          close-issue-message: |
            Closing due to inactivity. Feel free to reopen if you have updates or wish to continue working on this.
          
          # Pull request configuration
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: "stale"
          stale-pr-message: |
            This pull request has been inactive for 14 days. It will be closed in 7 days unless there is new activity.
            
            Please respond to feedback or push new commits to keep it open.
          close-pr-message: |
            Closing due to inactivity. Feel free to reopen when you're ready to continue.
          
          # Exemptions
          exempt-issue-labels: "blocked,in-progress,help wanted"
          exempt-pr-labels: "blocked,in-progress,wip"
          
          # Additional options
          delete-branch: true
          operations-per-run: 30
