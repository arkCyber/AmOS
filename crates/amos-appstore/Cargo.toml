[package]
name = "amos-appstore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Amos app store core engine: transport-agnostic app catalog/version models + a pluggable StoreProvider trait with a deterministic in-memory MockStoreProvider, plus an AppStore engine that drives download → checksum-verify → install/upgrade/uninstall. Same engine will drive a future store CLI and the Tauri System UI bridge; real HTTP catalogs plug in behind the StoreProvider seam."

[lib]
name = "amos_appstore"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json = "1"
tokio.workspace = true
async-trait = "0.1"
thiserror = "1"
sha2 = "0.10"
ed25519-dalek = "2"

# Web-bundle (tar.gz) installer: extract an app archive into an install dir.
tar = "0.4"
flate2 = "1"

# A real networked catalog/package backend (downloads over HTTP) plugs in behind
# the StoreProvider seam. Kept out of the default build so the offline workspace
# stays green, mirroring amos-mail's `live` gating of SMTP/IMAP. ureq is the same
# small blocking HTTP client amos-ai uses; here it runs inside spawn_blocking.
ureq = { version = "2", optional = true }

[features]
default = []
live = ["dep:ureq"]
