[package]
name = "amos-appstore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Amos app store core engine: transport-agnostic app catalog/version models + a pluggable StoreProvider trait with a deterministic in-memory MockStoreProvider, plus an AppStore engine that drives download → checksum-verify → install/upgrade/uninstall. Same engine will drive a future store CLI and the Tauri System UI bridge; real HTTP catalogs plug in behind the StoreProvider seam."

[lib]
name = "amos_appstore"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json = "1"
tokio.workspace = true
async-trait = "0.1"
thiserror = "1"
sha2 = "0.10"
ed25519-dalek = "2"
# Install rollback / uninstall cleanup: a bundle that could not be removed (while the
# registry says otherwise) is reported instead of being hidden behind the success path.
tracing.workspace = true

# Web-bundle (tar.gz) installer: extract an app archive into an install dir.
tar = "0.4"
flate2 = "1"

# The declarative PWA index manifest (`amos-app.toml`, `src/pwa.rs`). The only
# text format a *human developer* writes by hand in this crate, so it gets a
# real parser rather than hand-rolled string handling. Already in the lock file
# (via the Tauri build tooling), so this adds no new crate to download.
toml = "0.8"

# A real networked catalog/package backend (downloads over HTTP) plugs in behind
# the StoreProvider seam. Kept out of the default build so the offline workspace
# stays green, mirroring amos-mail's `live` gating of SMTP/IMAP. ureq is the same
# small blocking HTTP client amos-ai uses; here it runs inside spawn_blocking.
# `socks-proxy` is on so an `ALL_PROXY=socks5://…` environment (common in
# sandboxed CI) is honored instead of failing every connection.
ureq = { version = "2", optional = true, features = ["socks-proxy"] }

[features]
default = []
live = ["dep:ureq"]

[dev-dependencies]
# The PWA grammar must be the grammar the *enforcing* matcher implements, so the
# parity is pinned against the real matcher (`policy::domain_matches`) instead of a
# comment — see `pwa::tests::the_domain_grammar_is_what_the_guard_matcher_implements`.
amos-network-guard.workspace = true
