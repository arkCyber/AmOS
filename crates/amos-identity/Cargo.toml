[package]
name = "amos-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Amos digital-identity / DID domain core: did:key encoding & parsing (Ed25519 + Secp256k1 multicodecs), a deterministic key/wallet core layered over amos-web3 + ed25519-dalek, statement signing & verification against a DID, and a password-wrapped at-rest keystore (nonce/salt are explicit caller seams) — pure Rust, no PRNG in the core."

[lib]
name = "amos_identity"
path = "src/lib.rs"

[dependencies]
amos-web3 = { workspace = true }
ed25519-dalek = "2"
sha2 = "0.11"
bs58 = "0.5"
pbkdf2 = "0.12"
chacha20poly1305 = "0.10"
generic-array = "0.14"
thiserror = "1"
