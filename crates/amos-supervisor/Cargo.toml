[package]
name = "amos-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Amos process supervisor: spawn, monitor, and hot-restart CLI daemons."

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json = "1.0"
anyhow.workspace = true

# Optional integration: periodic wall-clock calibration via amos-timesync. Kept
# behind the `timesync` feature so the default (offline) build and behaviour stay
# unchanged; the supervisor stays transport-agnostic unless told otherwise.
amos-timesync = { workspace = true, optional = true }

# Optional integration: fire-and-forget alerts through the `amos-notifier`
# dispatcher when a supervised daemon crashes, exhausts its restart budget, or
# fails to spawn. Off by default so the supervisor's core (which is itself an
# offline test surface) is not pulled into the notifier's transitive deps.
amos-notifier = { workspace = true, optional = true }

[[bin]]
name = "amos-supervisor"
path = "src/bin/amos-supervisor.rs"

[features]
default = []
# Enables periodic network time calibration orchestrated by the supervisor.
timesync = ["dep:amos-timesync", "amos-timesync/ntp"]
# Enables notifier-backed observability of the supervisor's monitor loop.
# The two `dep:` markers guarantee the right build script reaches the crate.
notifier = ["dep:amos-notifier"]
