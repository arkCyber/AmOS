[package]
name = "amos-int"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Amos simultaneous-interpretation session engine: a transport-agnostic state machine and streaming pipeline (ASR -> translation -> TTS), mirroring sokuji's IClient/provider design so the same core drives both the CLI daemon and the Tauri UI."

[lib]
name = "amos_int"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
async-trait = "0.1"
serde.workspace = true
tokio.workspace = true
# A dropped output (a consumer more than `OUTPUT_CHANNEL_CAPACITY` behind) must be
# reported rather than vanishing: see `Session::emit`.
tracing.workspace = true

[dev-dependencies]
# `tests/output_backpressure.rs` captures the session's warning with its own subscriber
# (own process, like the supervisor's and the radio core's reporting tests).
tracing-subscriber.workspace = true
