[package]
name = "amos-translate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Amos simultaneous-interpretation daemon: a gRPC service over a Unix Domain Socket with pluggable translation providers (Ollama/Hermes/API)."

[lib]
name = "amos_translate"
path = "src/lib.rs"

[[bin]]
name = "amos-translate"
path = "src/main.rs"

[dependencies]
amos-proto.workspace = true
amos-int.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower.workspace = true
hyper-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json = "1.0"
async-trait = "0.1"
ureq = "2"

[dev-dependencies]
hyper-util.workspace = true
tower.workspace = true
amos-asr = { path = "../amos-asr" }
amos-tts = { path = "../amos-tts" }
