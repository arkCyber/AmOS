[workspace]

[package]
name = "amos-link-py"
version = "0.1.0"
edition = "2021"
authors = ["AmOS Contributors"]
description = "Python bindings for amos-link robot middleware"
license = "MIT OR Apache-2.0"

# An empty `[workspace]` table opts this crate out of the workspace rooted at
# the repo's top-level `Cargo.toml`. PyO3 extension modules are always built
# through `maturin`, never through the workspace's `cargo build`, and many
# pyo3 feature combos reject being compiled under a `[workspace.dependencies]`
# block. The `amos-link` path dependency below is resolved relative to the
# repo anyway — the workspace exclusion is *purely* a metadata trick.

[lib]
name = "amos_link_py"
crate-type = ["cdylib"]

[dependencies]
amos-link = { path = "../amos-link" }
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
pyo3 = { version = "0.21", features = ["auto-initialize"] }

[package.metadata.maturin]
name = "amos_link"
python-source = "python"
