[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "amos-link"
version = "0.1.0"
description = "Python bindings for amos-link robot middleware"
authors = [
    {name = "AmOS Contributors"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]
keywords = ["robotics", "middleware", "pubsub", "ros", "messaging"]

[project.urls]
Homepage = "https://github.com/yourusername/amos"
Repository = "https://github.com/yourusername/amos"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "amos_link._native"
