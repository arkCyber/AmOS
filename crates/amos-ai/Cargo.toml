[package]
name = "amos-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "amos AI CLI daemon: exposes the OS-level AI Agent as a gRPC service over a Unix Domain Socket."

[lib]
name = "amos_ai"
path = "src/lib.rs"

[[bin]]
name = "amos-ai"
path = "src/main.rs"

[dependencies]
amos-proto.workspace = true
# Peer-credential check for the daemon's unix socket (SO_PEERCRED / getpeereid):
# `std`'s `UnixStream::peer_cred()` is still unstable, so the two libc calls are the
# supported route. libc is already in the workspace's dependency graph transitively.
libc = "0.2"
amos-android.workspace = true
amos-telephony.workspace = true
amos-sensor.workspace = true
# AmOS-Link robot middleware (crates/amos-link + proto/robot_link.proto +
# docs/amos-link.md): the daemon mounts its CONTROL PLANE on the shared UDS so the
# System UI / a field tool can read the link's status, list its topics, inject a
# frame and stream heartbeats. Pure-Rust and offline by default (in-process broker);
# the Zenoh/Zenoh-over-LAN transport is a separate build feature of that crate.
amos-link.workspace = true
amos-profiling.workspace = true
amos-power = { workspace = true, features = ["linux"] }
amos-applife.workspace = true
amos-scheduler.workspace = true
# System working-status aggregator + real /proc sampler (CPU/mem) folded into
# get_status.system. The `linux` feature only adds std::fs reads of /proc (absent
# at runtime on macOS/dev → honest "unknown", never fabricated).
amos-monitor = { workspace = true, features = ["linux"] }
# Egress data-plane firewall domain core (policy + seam + Mock). Default build is
# pure std; the daemon mounts a Mock-backed NetGuardService (docs/anti-telemetry-egress-guard.md).
amos-network-guard.workspace = true
# Threshold-alert delivery. Pulls the dispatcher that the bridge fires into;
# the default daemon build (the one that ships to devices) keeps the bridge
# as a `None`-sink so it compiles to a no-op rather than gaining a transitive
# dependency. Operators who want paging set `notifier = ["dep:amos-notifier"]`
# (or build with `--features notifier`) and wire `Dispatcher` into the bridge.
amos-notifier = { workspace = true, optional = true }
# Passive egress telemetry-spy domain core (pure std). Only pulled in by the
# `telemetry-spy` feature, which adds the EgressMatch -> EgressHit mapping +
# `TelemetrySpySvc::ingest_match` feed seam (host-testable). Live pnet capture
# is a device/AOSP step (amos-telemetry-spy `audit` feature).
amos-telemetry-spy = { workspace = true, optional = true }
amos-display.workspace = true
amos-asr = { path = "../amos-asr" }
# Offline local vector-retrieval core (FlatIndex + Embedder seam) — consumed by
# `rag` (OllamaEmbedder + RagStore). Pure std, so it adds no native/network to
# the daemon's default build.
amos-vector-db = { path = "../amos-vector-db" }
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
uuid = { version = "1.10", features = ["v4"] }
async-trait = "0.1"
serde_json = "1.0"
ureq = "2"

# Compile-time switches for the native inference/ASR/accelerator backends.
#
# **`asr-sherpa` is ON by default (Gap 8 / F-ASR-001):** the device image ships a
# bundled sherpa model and the daemon must run *real* on-device speech
# recognition unless an operator deliberately opts out. Opt out of the native ASR
# engine with `cargo build -p amos-ai --no-default-features` (the daemon then
# logs an explicit warning before ever using the deterministic mock) or disable
# voice at runtime with `AMOS_ASR_BACKEND=off`.
#
# Accelerator SDK seams (see `docs/qcom-mtk-bringup.md`): `qnn` and `neuropilot`
# declare that the daemon was built against Qualcomm QNN / MediaTek NeuroPilot.
# They gate [`amos_ai::accelerator`] so those accelerators are only ever
# *claimed* when the matching SDK is actually linked. NNAPI/Vulkan/Metal are
# runtime backends (no compile-time SDK) and need no feature.
[features]
default = ["asr-sherpa"]
asr-sherpa = ["amos-asr/sherpa"]
qnn = []
neuropilot = []
# Rockchip RK3588 NPU (RKNN runtime) seam — see `docs/rk3588-bringup.md`. Declares
# the daemon was built against `librknnrt.so`; until the binding lands the
# backend returns an honest `NotImplemented(...)` error rather than fabricating
# success (with the feature *off* the same constructor answers `Provider(...)`,
# naming the unlinked SDK).
rknn = []
# In-process llama.cpp LLM runtime (no `allama` subprocess). Seam only today: the
# backend returns an honest `NotImplemented(...)` error until the binding is
# written (with the feature off it answers `Provider(...)` instead).
llama-cpp-inproc = []
# Bundled on-device model seam (Gap 4 / TODO 4.2, F-AI-017). Default OFF: an
# unset/`auto` `AMOS_BACKEND` then resolves to the honest `unconfigured` engine
# and **never** the mock. A **device image** turns this on so the image can stage
# a GGUF under the documented path (`bundled_model::bundled_model_resolver`) and
# have the daemon serve real local inference with no operator knob. Gates
# *resolution* only — no native dependency is linked, and the model file must
# actually exist on disk, else the daemon still reports `unconfigured`.
bundled-model = []
# Pulls the amos-telemetry-spy domain core and the EgressMatch -> proto EgressHit
# mapping / `TelemetrySpySvc::ingest_match` feed seam. Pure std (no pnet): the
# seam is host-testable, so a capture producer only needs to open the NIC
# (amos-telemetry-spy `audit` + a rooted/AmOS-AOSP slot) to start feeding.
telemetry-spy = ["dep:amos-telemetry-spy"]
# Pulls the live pnet capture producer (amos-telemetry-spy `audit`): the daemon
# opens a data interface named by AMOS_SPY_IFACE and feeds every decoded+scanned
# match into the SAME TelemetrySpySvc Watch stream serve() mounts. Device/AOSP
# path — needs raw-socket privilege; default build never compiles it (quiet).
telemetry-spy-audit = ["telemetry-spy", "amos-telemetry-spy/audit"]
# Pulls `amos-notifier` so the alert bridge can page on state transitions. Off
# by default so the standalone daemon (the build that ships to devices) keeps
# its transitive deps minimal; opt in for a deployment with a webhook/SMTP
# relay configured.
notifier = ["dep:amos-notifier"]

[dev-dependencies]
tower.workspace = true
hyper-util.workspace = true
# The integration tests drive the daemon's real tracing writer (`TeeWriter`), so the
# `MakeWriter` trait they call through must be nameable from `tests/`.
tracing-subscriber.workspace = true
# `is_deployment_unconfigured` tests share `std::env` (process-wide); concurrent
# threads would race on the env values. `#[serial]` on those tests serialises
# them. Used only inside the daemon's test module.
serial_test = "4"
