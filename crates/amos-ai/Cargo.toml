[package]
name = "amos-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "amos AI CLI daemon: exposes the OS-level AI Agent as a gRPC service over a Unix Domain Socket."

[lib]
name = "amos_ai"
path = "src/lib.rs"

[[bin]]
name = "amos-ai"
path = "src/main.rs"

[dependencies]
amos-proto.workspace = true
amos-android.workspace = true
amos-telephony.workspace = true
amos-asr = { path = "../amos-asr" }
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
num_cpus = "1.16"
uuid = { version = "1.10", features = ["v4"] }
async-trait = "0.1"
serde_json = "1.0"
ureq = "2"

# Compile-time switches for the native inference/ASR backends. The default
# build is lightweight (mock ASR); enabling `asr-sherpa` pulls the real
# sherpa-onnx local recognizer into the daemon so the bidi `Payload::Audio`
# channel runs genuine on-device speech recognition.
[features]
asr-sherpa = ["amos-asr/sherpa"]

[dev-dependencies]
tower.workspace = true
hyper-util.workspace = true
