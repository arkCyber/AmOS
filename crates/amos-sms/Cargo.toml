[package]
name = "amos-sms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Amos SMS domain core: real SMS threads/messages, a pluggable SmsProvider seam (Mock for host/tests + Android SmsGlue backend reading content://sms / sending via SmsManager), and a stable JSON wire contract. Design: docs/sms.md."

[lib]
name = "amos_sms"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde_json = "1"
# Real Android SMS backend (content://sms + SmsManager via the Kotlin SmsGlue).
# Optional: only pulled in when the `android` feature is enabled, so desktop/CI
# builds stay free of the JNI stack.
jni = { version = "0.21", optional = true }

[features]
default = []
# Enables `src/android.rs` (AndroidSmsProvider). Intended for on-device builds of
# the System UI APK (aarch64-linux-android); deliberately excluded from
# desktop/CI. Runtime needs a real Android VM + Context; `cargo check --features
# android` validates that it *compiles*.
android = ["dep:jni"]

