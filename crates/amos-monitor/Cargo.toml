[package]
name = "amos-monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Amos system working-status (health) domain core: a transport-/platform-agnostic aggregator that folds system load (CPU/memory via a SystemSampler seam), live battery/power (amos-profiling PowerSource) and per-app lifecycle counts (amos-applife AppLifecycle) into one honest SystemHealth snapshot. Pure std; real /proc + Android battery reads are feature-gated seams. Design: docs/system-monitor.md."

[lib]
name = "amos_monitor"
path = "src/lib.rs"

[dependencies]
# Live board power / battery model we fold into the health snapshot (pure std).
amos-profiling.workspace = true
# Per-app process lifecycle counts we summarise (pure std).
amos-applife.workspace = true

[features]
default = []
# Host-compilable /proc-based CPU/memory sampler (`src/linux.rs`): real reads on a
# Linux/Android device, offline tests over an injected procfs root tempdir.
linux = []
# Compile-gated `src/android.rs` skeleton for the on-device System UI APK build
# (real Android SystemStatus reads remain device bring-up). Validated with
# `cargo check -p amos-monitor --features android`.
android = []

# `examples/sample_health.rs` uses `amos_monitor::linux::LinuxSystemSampler`, which only
# exists with the `linux` feature — so it must declare that requirement (REQ-A463).
#
# Without this the package is broken **in isolation** and only a workspace build hides it:
# `cargo build -p amos-monitor --all-targets` fails with E0432 (unresolved import), while
# `cargo clippy --workspace --all-targets` passes because `amos-ai` depends on this crate
# with `features = ["linux"]` and cargo unifies features across the workspace. The defect
# was found by *running* the example (`cargo run -p amos-monitor --example sample_health`),
# not by any gate — `make lint` is green either way. With the declaration, cargo skips the
# target when the feature is off (like `amos-asr`'s `sherpa_asr`, `amos-tts`'s `piper_tts`,
# `amos-timesync`'s `ntp_probe`) and prints "requires the features: `linux`" instead of an
# unresolved-import error.
[[example]]
name = "sample_health"
required-features = ["linux"]

