[package]
name = "amos-ime"
version.workspace = true
edition.workspace = true
license.workspace = true
# The pinyin engine dependency declares `rust-version = "1.95"` (edition 2024);
# the workspace floor is 1.80, so this crate states its own honest floor instead
# of pretending the older one holds.
rust-version = "1.95"
description = "AmOS input-method (IME) domain core: a Mandarin pinyin engine (inputx-pinyin) + fuzzy-pair preferences + per-user learning persistence + a headless-testable typing session. Backs the System UI's on-screen keyboard (docs/input-method.md)."

[lib]
name = "amos_ime"
path = "src/lib.rs"

[features]
default = ["predict"]
# 联想 / next-word prediction: the word-trigram dict (`predict_next_words_context`)
# plus the word-bigram FSAs that `bigram_boost` feeds to the composition Viterbi.
# Measured cost in the System UI binary: see `docs/input-method.md` §Deferred
# (the data is ~18.7 MB of embedded FSTs). Turning it off is a supported build
# (`--no-default-features`): the crate answers "no predictions" rather than
# pretending, and every call site here is unconditional (no `cfg` in our code).
predict = ["inputx-pinyin/bigrams", "inputx-pinyin/trigrams"]

[dependencies]
# Core engine only by default: the embedded FST dictionary (~4.2 MB, ~165k pinyin
# codes) and the segmentation-Viterbi `best_composition` sentence builder.
# The `predict` feature above adds the bigram + trigram FSTs.
inputx-pinyin = { version = "1.4", default-features = false }
serde.workspace = true
serde_json = "1.0"
