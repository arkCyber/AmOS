[package]
name = "amos-ota-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Amos system-update (OTA) CLI: compare versions, hash an image, and evaluate/install an update from a manifest over the amos-ota domain core. The `install` command runs the whole pipeline against a *local* image in dry-run — it stages nothing on the host and reboots nothing; it exists so the decision layer is exercisable end to end without a device."

[lib]
name = "amos_ota_cli"
path = "src/lib.rs"

[[bin]]
name = "amos-ota-cli"
path = "src/main.rs"

[dependencies]
amos-ota = { path = "../amos-ota" }
anyhow.workspace = true
serde_json = "1"

[dev-dependencies]
# Test-only: produce a *real* Ed25519 signature for the `--trust-key-hex` path
# (the CLI itself never signs).
ed25519-dalek = "2"
hex = "0.4"
