[package]
name = "amos-telephony"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Amos telephony domain core: phone-number + emergency-map rules, a per-call CallSession state machine, and pluggable TelephonyProvider/EmergencyTelephonyProvider seams (Mock + feature-gated Android). Design: docs/telephony.md."

[lib]
name = "amos_telephony"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
tokio-stream.workspace = true
async-trait = "0.1"
thiserror = "1"
amos-proto.workspace = true
tonic.workspace = true
# Real Android backend (dial via the System UI's app Context → `ACTION_CALL`/Telecom
# under ROLE_DIALER). Optional: only pulled in when the `android` feature is enabled,
# so desktop/CI builds stay free of the JNI stack (mirrors `amos-radio`).
jni = { version = "0.21", optional = true }

[features]
default = []
# Enables `src/android.rs` (AndroidTelephonyProvider / AndroidEmergencyTelephonyProvider).
# Intended for on-device builds of the System UI (ROLE_DIALER) APK (cross-compiled for
# aarch64-linux-android); deliberately excluded from desktop/CI. Runtime still needs a
# real Android VM + a Context; `cargo check --features android` validates it *compiles*.
android = ["dep:jni"]

[dev-dependencies]
tower.workspace = true
hyper-util.workspace = true

