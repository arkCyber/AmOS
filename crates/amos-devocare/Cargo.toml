[package]
name = "amos-devocare"
version = "0.1.0"
edition = "2021"
description = "AmOS device-care (手机管家) domain core: junk scan/clean, safe uninstall policy, permission review and a folded care report. Pure, deterministic, no I/O."
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
