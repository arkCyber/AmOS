  .dcol{display:flex;flex-direction:column;align-items:center;gap:6px}
  .dlab{font-size:11px;font-weight:600;color:rgba(255,255,255,.96);text-shadow:0 1px 3px rgba(0,0,0,.6)}

  #sz-ai svg{width:86%;height:86%}

  .dialtop{width:100%;text-align:center;padding:34px 6px 0}
  .number{color:#111;font-weight:300;font-size:26px;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabs{display:flex;gap:2px;margin:16px auto 4px;width:100%;background:rgba(120,120,128,.12);border-radius:20px;padding:3px}

  .tab.active{background:#fff;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.08)}

  .actions{display:flex;align-items:flex-start;justify-content:center;gap:48px;margin-top:8px}
  .bcol{display:flex;flex-direction:column;align-items:center;gap:4px;width:44px}
