[package]
name = "amos-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "amos System UI: Tauri 2 shell + Rust core that bridges the WebView to the AI daemon over UDS."

# Tauri mobile builds require both a staticlib (for the mobile platform shell)
# and a cdylib/rlib (for the desktop binary entrypoint).
[lib]
name = "amos_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
amos-proto.workspace = true
amos-wm = { path = "../amos-wm" }
amos-scheduler = { path = "../amos-scheduler" }
amos-int.workspace = true
amos-mail = { path = "../amos-mail" }
amos-appstore = { path = "../amos-appstore" }
amos-podcast = { path = "../amos-podcast" }
amos-translate = { path = "../amos-translate" }
amos-tts = { path = "../amos-tts" }
amos-asr = { path = "../amos-asr", optional = true }
amos-audio = { path = "../amos-audio" }
amos-radio = { path = "../amos-radio" }
amos-flashlight.workspace = true
# amos-sms: real-SMS domain core — the System UI's Messages screen reads/writes
# through the SmsProvider seam (Mock on host, Android SmsGlue on device).
amos-sms = { path = "../amos-sms" }
# amos-blocklist: spam-blocking rule core (exact/prefix, per channel) shared by
# the SMS filter and the Android CallScreeningService.
amos-blocklist = { path = "../amos-blocklist" }
# amos-devocare: device-care (手机管家) domain core — junk scan/plan/clean, the
# uninstall safety policy, the read-only permission review and the folded care
# report. Its `hostfs` backend is the root-confined filesystem scanner/provider.
amos-devocare = { path = "../amos-devocare" }
amos-display.workspace = true
# amos-ime: the input-method (IME) domain core — the pinyin engine (inputx-pinyin)
# plus fuzzy preferences and per-user learning. Backs the System UI's on-screen
# keyboard through the `ime_*` commands (docs/input-method.md).
amos-ime = { path = "../amos-ime" }
# amos-media: external-storage/media domain core — its MediaManager + MediaProvider
# seam backs the local `media_*` commands (Mock on host; Android MediaStore on-device
# later). See docs/android-storage-unify.md + docs/media.md.
amos-media = { path = "../amos-media" }
# amos-pdf-parser: PDF text extraction backed by lopdf. Used by the files
# preview command (files_preview_bytes) to render PDF previews in the UI.
amos-pdf-parser = { path = "../amos-pdf-parser" }
# amos-link: the robot middleware. The link bridge's *write* side must encode a
# control command exactly the way the CLI does — the payload is the bincode of
# `AgentAction { json }` and the topic comes from `Topic::channel_topic`, so this
# crate (not a hand-rolled copy of the wire format) owns the encoding. Default
# features are off: no zenoh, no multicast socket, nothing the UI does not use.
amos-link = { path = "../amos-link" }
# flate2: gzip compression for the files bundle export/import.
flate2 = "1"
# Shared host<->guest clipboard-sync protocol + ClipboardProvider seam + guest
# agent core (single source of truth for the wire contract). The host transport
# (src/clipboard_guest.rs) re-exports crate::amos_clipboard::proto from here.
amos-clipboard = { path = "../amos-clipboard" }
# amos-telemetry-spy: the domain core whose `as_str()` keys are the *declared*
# wire spelling of the identifier-kind / protocol / confidence vocabularies the
# telemetry-spy bridge forwards to the UI (src/telemetry_spy.rs derives from it,
# so the bridge cannot drift from the authority — REQ-A650 / F-SH-118).
amos-telemetry-spy.workspace = true
async-trait = "0.1"
# amos-sensor: device-sensor domain core — the System UI's own sensor read side
# (LiveSensorProvider stream bus + SensorManager energy policy) backs the local
# `sensor_host` commands; its `android` feature adds the on-device backend.
amos-sensor = { path = "../amos-sensor" }
# amos-ota: system-update decision core (offer/eligibility policy). Until
# src/ota.rs this crate had no product caller at all — the shell could not even
# ask "is there an update for me?" (REQ-A754 / F-SH-211).
amos-ota = { path = "../amos-ota" }
# Real Android radio provider (via amos-radio/android). Optional: only pulled in
# when amos-tauri's `android` feature is on (System UI APK on-device build).
jni = { version = "0.21", optional = true }
# Rust `tracing` sink: logcat on device, stderr on desktop (src/host_log.rs). Not
# optional since REQ-A229 — on desktop it is what makes every `info!`/`warn!` in this
# crate visible at all (before that, the release PC build printed nothing).
tracing-subscriber = { workspace = true }
amos-jni = { path = "../amos-jni", optional = true }
tauri.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json = "1.0"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
# PTY for the terminal backend; enabled only by the `terminal-pty` feature.
portable-pty = { version = "0.8", optional = true }
# File-system watcher for `host_fs_watch_*`. `notify` is the cross-platform event
# stream, `notify-debouncer-mini` collapses editor-save storms (create+write+write
# back-to-back) into one event per debounce window (120 ms).
notify = "6"
notify-debouncer-mini = "0.4"
# dirs: home dir / XDG paths used by wine.rs and linux_apps.rs (both desktop-only modules).
dirs = "7.0"
# WebMan browser download pipeline (src/webman_download.rs): the real streaming
# HTTP client. `ureq` is the same blocking client amos-appstore / amos-ai /
# amos-translate already use; the `cookies` feature turns its Agent into a real,
# persistable RFC 6265 jar (cookie_store) — the browser's cookie management.
# Transfers run on `spawn_blocking`, never on the async reactor.
ureq = { version = "2", features = ["cookies"] }
cookie_store = "0.21"
tracing.workspace = true

# macOS/iOS AirPlay integration via AVFoundation
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSNotification", "NSValue"] }
objc2-av-foundation = { version = "0.3", features = ["AVRouteDetector", "AVPlayer", "AVAudioSession"] }
block2 = "0.5"

# `NSApplication` (menu.rs): the two app-menu items that macOS means **app-wide** cannot
# be expressed with muda items — `hideOtherApplications:` / `unhideAllApplications:` ARE
# the semantics of "Hide Others" (⌘⌥H) and "Show All" (REQ-A423). Already in the lock via
# tauri (which enables this exact feature set), so this adds no new code to build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication"] }

# The **system tray** (REQ-A864). `tauri::tray` sits behind tauri's own `tray-icon` feature,
# and that feature is desktop-only: the module does not exist on Android/iOS, which is why
# `tray.rs` keeps every `tauri::tray` reference behind `#[cfg(desktop)]`. The predicate below
# is that same condition — `tauri-build` sets `desktop = !(ios || android)` — so the
# *dependency* and the *code* are switched by one rule rather than two that agree by
# accident. `tray-icon`, `muda` and `libappindicator` were already resolved into the lock by
# tauri, so this fetches no new crate; the feature only decides whether it is compiled.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { workspace = true, features = ["tray-icon"] }

# Opt-in local streaming ASR: compiles + links the native sherpa-onnx lib.
# Enable with `--features sherpa-asr` (or via tauri), and set AMOS_SHERPA_MODEL_DIR
# to a directory with tokens.txt + encoder/decoder/joiner .onnx so interpret_start
# uses local sherpa ASR instead of the daemon's mock ASR.
#
# Opt-in local TTS: enables amos-tts' Piper backend (piper-rs + onnxruntime +
# espeak-ng native libs). Enable with `--features piper-tts`, and set
# AMOS_PIPER_MODEL_DIR to a voice dir so tts_synthesize uses local Piper.
[features]
default = []
# **The production-UI switch, and the reason a release run used to show a white
# window** (REQ-A421; measured 2026-09-18). `tauri` decides at *compile* time
# whether the WebView loads `build.devUrl` or the embedded `frontendDist`
# (`tauri::is_dev() == !cfg!(feature = "custom-protocol")`, and tauri-codegen
# stamps the same `dev` cfg through `DEP_TAURI_DEV`). The Tauri CLI passes
# `--features tauri/custom-protocol` on its own, which is why `make app-open`
# worked — while `cargo build --release -p amos-tauri` did NOT, so
# `scripts/run-ui-release.sh` ("the PC path that embeds dist") built a binary that
# fetched `http://localhost:1420`, found nothing and rendered an empty window
# (measured: main-frame -1004, 1 176 colours, zero `[csp-probe]` lines). Declaring
# the feature here is what lets a *plain cargo* build ask for the same thing, and
# `scripts/release-ui-mode-scan.mjs` fails if a release UI build forgets it.
custom-protocol = ["tauri/custom-protocol"]
# On-device System UI: back RadioBridge with amos-radio's AndroidRadioProvider
# and sensor_host with amos-sensor's AndroidSensorProvider (both jni). Desktop/CI
# omit it so no JNI stack is compiled. Host `cargo check --features android` still
# validates that the wiring compiles. `amos-audio/aaudio` lets PlatformMic::open_device
# open the real NDK AAudio mic (API >= 26) so the always-on assistant-voice worker
# can capture on-device; TinyALSA is deliberately *not* enabled here (it is the
# system-component seam, not the app path).
android = [
    "dep:jni",
    "dep:amos-jni",
    "amos-radio/android",
    "amos-flashlight/android",
    "amos-sensor/android",
    "amos-audio/aaudio",
    # Media backend over the Kotlin MediaStoreGlue (crates/amos-media android).
    "amos-media/android",
    # Real SMS backend over the Kotlin SmsGlue (crates/amos-sms android:
    # content://sms read + SmsManager send).
    "amos-sms/android",
]
sherpa-asr = ["dep:amos-asr", "amos-asr/sherpa"]
piper-tts = ["amos-tts/piper"]
# Real HTTP app-store backend for the StoreBridge (remote catalog + package
# downloads). Off by default so the UI build stays offline-green.
appstore-live = ["amos-appstore/live"]
# Real HTTP RSS/Atom fetcher for the PodcastBridge. Off by default so the UI
# build stays offline-green; with it on, `AMOS_PODCAST_LIVE=1` still has to be set
# for the process to actually reach the network.
podcast-live = ["amos-podcast/live"]
# On-device / host-target TCP transport for the AI daemon bridge (docs "AmOS on a
# retail Android" bring-up): when enabled (plus/or `AMOS_TCP_ADDR` env), the System
# UI connects to `amos-ai` over loopback TCP instead of a Unix socket. Needed on a
# non-root retail device where a shell-run daemon cannot create a Unix socket under
# SELinux but can bind loopback TCP (see crates/amos-ai/src/server.rs
# `resolve_tcp_addr`). Desktop host builds omit it (UDS), unless AMOS_TCP_ADDR is set.
tcp = []
# PTY-backed terminal shell (device): off by default — the safe posture is a
# non-executing build. Enable on-device (System UI APK) with the real pty crate.
terminal-pty = ["dep:portable-pty"]

# Integration tests spawn the real amos-ai tonic server in-process so the AI
# bridge command core can be exercised headlessly over UDS (no Tauri/GUI).
[dev-dependencies]
amos-ai = { path = "../amos-ai" }
# The device-care domain crate, for building audit events in the bridge e2e the
# same way `devcare_clean` does.
amos-devocare = { path = "../amos-devocare" }
# Used by recording.rs tests to create ephemeral directories without needing
# platform-specific /tmp logic.
tempfile = "3"
# Serializes tests that mutate process-global state (env vars, lazy statics).
# host_fs::tests swaps `AMOS_HOST_FS_ROOT` between cases via RAII; `cargo test`
# runs tests on multiple threads by default and `std::env::set_var` is racy.
serial_test = "3"
# `tauri::test::{mock_app, mock_builder, mock_context}` — the only way to drive
# `dock_badge::apply()` through its **production** path (the ledger it writes, the
# `dock-badge-changed` emit, the empty-label collapse) without a real window.
# `test` is an empty feature on the tauri side (no extra dependencies); it exists
# because tauri's own mock module is behind `cfg(any(test, feature = "test"))`,
# and a dependency is never compiled with `cfg(test)`.
tauri = { workspace = true, features = ["test"] }
