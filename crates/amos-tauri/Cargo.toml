[package]
name = "amos-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "amos System UI: Tauri 2 shell + Rust core that bridges the WebView to the AI daemon over UDS."

# Tauri mobile builds require both a staticlib (for the mobile platform shell)
# and a cdylib/rlib (for the desktop binary entrypoint).
[lib]
name = "amos_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
amos-proto.workspace = true
amos-wm = { path = "../amos-wm" }
amos-scheduler = { path = "../amos-scheduler" }
amos-int.workspace = true
amos-mail = { path = "../amos-mail" }
amos-appstore = { path = "../amos-appstore" }
amos-translate = { path = "../amos-translate" }
amos-tts = { path = "../amos-tts" }
amos-asr = { path = "../amos-asr", optional = true }
amos-audio = { path = "../amos-audio" }
amos-radio = { path = "../amos-radio" }
amos-flashlight.workspace = true
# amos-sms: real-SMS domain core — the System UI's Messages screen reads/writes
# through the SmsProvider seam (Mock on host, Android SmsGlue on device).
amos-sms = { path = "../amos-sms" }
# amos-blocklist: spam-blocking rule core (exact/prefix, per channel) shared by
# the SMS filter and the Android CallScreeningService.
amos-blocklist = { path = "../amos-blocklist" }
# amos-devocare: device-care (手机管家) domain core — junk scan/plan/clean, the
# uninstall safety policy, the read-only permission review and the folded care
# report. Its `hostfs` backend is the root-confined filesystem scanner/provider.
amos-devocare = { path = "../amos-devocare" }
amos-display.workspace = true
# amos-media: external-storage/media domain core — its MediaManager + MediaProvider
# seam backs the local `media_*` commands (Mock on host; Android MediaStore on-device
# later). See docs/android-storage-unify.md + docs/media.md.
amos-media = { path = "../amos-media" }
# Shared host<->guest clipboard-sync protocol + ClipboardProvider seam + guest
# agent core (single source of truth for the wire contract). The host transport
# (src/clipboard_guest.rs) re-exports crate::amos_clipboard::proto from here.
amos-clipboard = { path = "../amos-clipboard" }
async-trait = "0.1"
# amos-sensor: device-sensor domain core — the System UI's own sensor read side
# (LiveSensorProvider stream bus + SensorManager energy policy) backs the local
# `sensor_host` commands; its `android` feature adds the on-device backend.
amos-sensor = { path = "../amos-sensor" }
# Real Android radio provider (via amos-radio/android). Optional: only pulled in
# when amos-tauri's `android` feature is on (System UI APK on-device build).
jni = { version = "0.21", optional = true }
tauri.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json = "1.0"
base64 = "0.21"
# PTY for the terminal backend; enabled only by the `terminal-pty` feature.
portable-pty = { version = "0.8", optional = true }
tracing.workspace = true

# Opt-in local streaming ASR: compiles + links the native sherpa-onnx lib.
# Enable with `--features sherpa-asr` (or via tauri), and set AMOS_SHERPA_MODEL_DIR
# to a directory with tokens.txt + encoder/decoder/joiner .onnx so interpret_start
# uses local sherpa ASR instead of the daemon's mock ASR.
#
# Opt-in local TTS: enables amos-tts' Piper backend (piper-rs + onnxruntime +
# espeak-ng native libs). Enable with `--features piper-tts`, and set
# AMOS_PIPER_MODEL_DIR to a voice dir so tts_synthesize uses local Piper.
[features]
default = []
# On-device System UI: back RadioBridge with amos-radio's AndroidRadioProvider
# and sensor_host with amos-sensor's AndroidSensorProvider (both jni). Desktop/CI
# omit it so no JNI stack is compiled. Host `cargo check --features android` still
# validates that the wiring compiles. `amos-audio/aaudio` lets PlatformMic::open_device
# open the real NDK AAudio mic (API >= 26) so the always-on assistant-voice worker
# can capture on-device; TinyALSA is deliberately *not* enabled here (it is the
# system-component seam, not the app path).
android = [
    "dep:jni",
    "amos-radio/android",
    "amos-flashlight/android",
    "amos-sensor/android",
    "amos-audio/aaudio",
    # Media backend over the Kotlin MediaStoreGlue (crates/amos-media android).
    "amos-media/android",
    # Real SMS backend over the Kotlin SmsGlue (crates/amos-sms android:
    # content://sms read + SmsManager send).
    "amos-sms/android",
]
sherpa-asr = ["dep:amos-asr", "amos-asr/sherpa"]
piper-tts = ["amos-tts/piper"]
# Real HTTP app-store backend for the StoreBridge (remote catalog + package
# downloads). Off by default so the UI build stays offline-green.
appstore-live = ["amos-appstore/live"]
# On-device / host-target TCP transport for the AI daemon bridge (docs "AmOS on a
# retail Android" bring-up): when enabled (plus/or `AMOS_TCP_ADDR` env), the System
# UI connects to `amos-ai` over loopback TCP instead of a Unix socket. Needed on a
# non-root retail device where a shell-run daemon cannot create a Unix socket under
# SELinux but can bind loopback TCP (see crates/amos-ai/src/server.rs
# `resolve_tcp_addr`). Desktop host builds omit it (UDS), unless AMOS_TCP_ADDR is set.
tcp = []
# PTY-backed terminal shell (device): off by default — the safe posture is a
# non-executing build. Enable on-device (System UI APK) with the real pty crate.
terminal-pty = ["dep:portable-pty"]

# Integration tests spawn the real amos-ai tonic server in-process so the AI
# bridge command core can be exercised headlessly over UDS (no Tauri/GUI).
[dev-dependencies]
amos-ai = { path = "../amos-ai" }
# The device-care domain crate, for building audit events in the bridge e2e the
# same way `devcare_clean` does.
amos-devocare = { path = "../amos-devocare" }
