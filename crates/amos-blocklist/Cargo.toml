[package]
name = "amos-blocklist"
version = "0.1.0"
edition = "2021"
description = "AmOS spam blocking: number rules (exact/prefix, per channel) for calls and SMS. Pure, deterministic, no I/O."
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
